# กัน Supabase รุ่นฟรีโดน pause (ไม่มีการใช้งาน 7 วัน = หยุด) → ยิงอ่าน DB ทุก 3 วัน
# ต้องตั้ง Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)
# ตาราง rooms อ่านได้เฉพาะคนล็อกอิน → anon ได้ [] (200) แต่ยังเป็น query จริงถึง DB
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 1 */3 * *'   # 08:00 เวลาไทย ทุก 3 วัน (cron รันเฉพาะบน main)
  workflow_dispatch:         # ปุ่ม Run workflow ไว้กดเทส

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: อ่าน 1 แถวจาก rooms (status ไม่ใช่ 2xx = แดง)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "ยังไม่ได้ตั้ง Secrets"; exit 1; }
          curl -sS --fail-with-body --retry 3 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
